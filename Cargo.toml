[workspace]
resolver = "2"
members = [
    "crates/rcl-core",
    "crates/rcl-macros",
    "crates/rcl-gui",
    "examples/sample-mod",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["RustyConfigLib Contributors"]
license = "LGPL-3.0-or-later"
repository = "https://github.com/your-org/rusty-config-lib"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"
syn = "2.0"
quote = "1.0"
proc-macro2 = "1.0"
