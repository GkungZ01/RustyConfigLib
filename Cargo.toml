[package]
name = "rusty-config-lib"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "LGPL-3.0-or-later"
authors = ["GkungZ01"]
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
rcl-core = { path = "crates/rcl-core" }
rcl-gui = { path = "crates/rcl-gui" }
rcl-macros = { path = "crates/rcl-macros" }

[package.metadata.horizon]
sdk = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"

[workspace]
resolver = "2"
members = [
    "crates/rcl-core",
    "crates/rcl-macros",
    "crates/rcl-gui",
    "examples/sample-mod",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["RustyConfigLib Contributors"]
license = "LGPL-3.0-or-later"
repository = "https://github.com/GkungZ01/RustyConfigLib"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"
syn = "2.0"
quote = "1.0"
proc-macro2 = "1.0"
